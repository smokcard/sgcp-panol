<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Acceso al Sistema - SGCP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; width: 100%; max-width: 400px; padding: 2rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .badge { background: #f59e0b; color: #000; padding: 0.2rem 0.5rem; border-radius: 4px; font-weight: 800; font-size: 0.8rem; }
    input { width: 100%; padding: 0.75rem; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; margin-top: 0.3rem; margin-bottom: 1rem; box-sizing: border-box; }
    button { width: 100%; padding: 0.8rem; background: #3b82f6; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; }
    .alert { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; padding: 0.7rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.85rem; }
    .alert-success { background: rgba(16, 185, 129, 0.2); border-color: #10b981; color: #86efac; }
  </style>
</head>
<body>
  <div class="card">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <span class="badge">SGCP PAÑOL</span>
      <h2 style="margin-top: 0.5rem;">Iniciar Sesión</h2>
    </div>
    {% if messages %}
      {% for m in messages %}
        <div class="alert {% if m.tags == 'success' %}alert-success{% endif %}">{{ m }}</div>
      {% endfor %}
    {% endif %}
    <form method="POST">
      {% csrf_token %}
      <label>RUT DEL USUARIO</label>
      <input type="text" name="rut" placeholder="Ej: 11.111.111-1" required autofocus>
      <label>CONTRASEÑA</label>
      <input type="password" name="password" placeholder="••••••••" required>
      <button type="submit">Ingresar</button>
    </form>
    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
      ¿No tienes cuenta? <a href="{% url 'registro' %}" style="color: #f59e0b; text-decoration: none; font-weight: bold;">Crear Cuenta</a>
    </div>
  </div>
</body>
</html>
